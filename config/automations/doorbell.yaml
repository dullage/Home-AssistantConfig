# Doorbell
- alias: doorbell
  initial_state: true
  trigger:
    - platform: device
      domain: mqtt
      device_id: d572fbda577747ca835c8fe948a600ae
      type: action
      subtype: single
    - platform: device
      domain: mqtt
      device_id: d572fbda577747ca835c8fe948a600ae
      type: action
      subtype: double
    - platform: device
      domain: mqtt
      device_id: d572fbda577747ca835c8fe948a600ae
      type: action
      subtype: triple
    - platform: device
      domain: mqtt
      device_id: d572fbda577747ca835c8fe948a600ae
      type: action
      subtype: quadruple
  action:
    - service: media_player.play_media
      target:
        entity_id: media_player.justboom
      data:
        announce: true
        media:
          media_content_type: music
          media_content_id: file:///home/dullage/doorbell.wav
    - service: camera.snapshot
      entity_id: camera.front_door
      data:
        filename: /media/front_door.jpg
    - service: notify.iphones
      data:
        message: "Doorbell"
        data:
          image: /media/local/front_door.jpg
          url: /lovelace/4  # CCTV Tab
    - delay:
        seconds: 5
